# Dependabot configuration
version: 2
updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - patch
      minor:
        patterns:
          - "*"
        update-types:
          - minor
      major:
        patterns:
          - "*"
        update-types:
          - major
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Actions are pinned to a bare major tag, which already tracks every patch
    # and minor; moving @v2 to @v2.85.3 would only freeze it.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
  # Node.js dependencies (docs / tooling)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      npm:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(npm-deps)"
  # Node.js dependencies (UI / frontend)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
    groups:
      ui:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ui-deps)"
