[workspace]
resolver = "2"
members = [
  "crates/apif-twoq-cache",
  "crates/apif-source-row",
  "crates/apif-source-error",
  "crates/apif-cfg-runtime",
  "crates/apif-query",
  "crates/apif-semantics",
  "crates/apif-optimizer",
  "crates/apif-diagnostics",
  "crates/apif-ast",
  "crates/apif-parser",
  "crates/apif-assert",
  "crates/apif-state",
  "crates/apif-plugins",
  "crates/apif-execution",
  "crates/apif-utils",
  "crates/apif-report",
  "crates/apif-grpc-transport",
  "crates/apif-http-transport",
]

[workspace.package]
version = "1.11.0"
edition = "2024"
authors = ["bavix"]
license = "MIT"
repository = "https://github.com/gripmock/grpctestify-rust"
readme = "README.md"
rust-version = "1.97"

# Panic-prone-construct gate: `unwrap`/`expect` in production code are flagged so
# a new one can't slip in unreviewed. Test code is exempt via clippy.toml
# (`allow-unwrap-in-tests`). Verified-safe production sites carry a local
# `#[allow(clippy::unwrap_used)]`/`expect_used` with a reason.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
async-trait = "0.1"

# CLI
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

# Error handling
anyhow = "1.0"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# gRPC
tonic = "0.14.5"
tonic-prost = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.3"
prost-reflect = { version = "0.16", features = ["serde"] }
tonic-reflection = "0.14.5"

# JSON/YAML
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2.14", features = ["serde"] }
minijinja = "2.6"

# TLS
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }

# Regular expressions
regex = "1.12"

# UUID validation
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }

# Timestamp
chrono = "0.4"

# Email validation
email_address = "0.2"

# URL parsing
url = "2.5"

sha2 = "0.11"
semver = "1.0"


# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration

# File operations
walkdir = "2.5"
globset = "0.4"
ignore = "0.4"

# System info
sysinfo = "0.39"

# Memory-mapped files
memmap2 = "0.9"

# JQ
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = { version = "2.0", features = ["serde"] }

# File system
crc32fast = "1.5"

# JSON Schema
jsonschema = "0.49"

# Fake data generation
fake = "5.1"

# HTTP/1.1 client for gRPC-Web / ConnectRPC
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "stream",
] }

# Web UI (play command)
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"

# `target/` had grown past 180 GB. The multiplier is this workspace's shape:
# 54 integration-test files plus 5 benches plus per-crate unittests are each a
# separate statically linked binary, and with Cargo's defaults every one of them
# carried full debuginfo for the entire dependency tree (tonic, tokio, rhai,
# regex, chrono...) — debug data for code nobody here steps through.
[profile.release]
# The request path crosses six crates; without cross-crate inlining none of the
# small hot functions in apif-execution / apif-grpc-transport can be folded into
# their callers. Measured -7.3% instructions per request on a 26-byte unary call
# (157 262 -> 145 825) and -3.1% at 64 KB. A compiler setting, not a dependency —
# the binary stays self-contained.
#
# Costs build time: `cargo build --release` goes from ~42 s to ~3.5 min here.
# That is a release action, not the inner loop — `cargo test` uses the dev
# profile and is unaffected.
lto = "thin"
codegen-units = 1

[profile.dev]
# Enough for backtraces with file/line, without the type and variable records
# that dominate the size.
debug = "line-tables-only"
# Incremental state is per-crate and additive; a workspace of 31 crates whose
# normal use is full `cargo test --workspace` runs rebuilds wholesale anyway.
incremental = false

# Dependencies are not debugged from here, so they need no debuginfo at all.
# This is the single largest saving of the three.
[profile.dev.package."*"]
debug = false

[package]
name = "grpctestify"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "gRPC testing utility written in Rust"
rust-version.workspace = true
autobenches = false

[lints]
workspace = true

[[bin]]
name = "grpctestify"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true }
clap_complete = { workspace = true }

# Error handling
anyhow = { workspace = true }
async-trait = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-stream = { workspace = true }

# Pure-Rust protobuf compiler (for proto file support)
protox = "0.9"

# File watching for play mode auto-reload
notify = "8"

# Pure-Rust git (no shell-out). Not zlib-ng/max-performance/curl/native-tls —
# those pull in C libraries; -rust-tls reuses reqwest's rustls stack.
gix = { version = "0.86", default-features = false, features = [
  "basic",
  "worktree-mutation",
  "blocking-http-transport-reqwest-rust-tls",
  "sha1",
] }

# Rhai for `--plugin-dir` reporter scripts (metrics-collector plugins) — the
# assertion-plugin side already depends on this (crates/apif-plugins), this
# is the same crate/version/features for the Reporter-hook adapter which
# lives here since `Reporter` (apif-report) has no reason to know about rhai.
rhai = { version = "1", features = ["sync", "serde", "metadata"] }

# Cross-platform hostname lookup (pure-Rust API over the platform syscall,
# no shell-out) for Allure's `host` Timeline label.
gethostname = "1"

# Scratch clone dirs for `plugins install` (already a dev-dependency; also
# needed at runtime now)
tempfile = "3.27"

# gRPC
tonic = { workspace = true, features = [
  "tls-ring",
  "tls-native-roots",
  "transport",
  "gzip",
] }
tonic-prost = { workspace = true, optional = true }
# grpc-web server support — used ONLY by the test-servers feature to expose the
# tonic reference services over grpc-web for integration tests. Pure Rust; never
# linked into the default (shipped) CLI build.
tonic-web = { version = "0.14", optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic-reflection = { workspace = true }

# Pure-Rust gzip (miniz_oxide backend) for grpc-web/connect message compression.
# Already pulled transitively via tonic's `gzip` feature; declared directly here
# so the HTTP transports can gzip/gunzip framed messages.
flate2 = "1"

# JSON/YAML
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
minijinja = { workspace = true }

# TLS
rustls = { workspace = true }

# UUID validation
uuid = { workspace = true }

# Timestamp
chrono = { workspace = true }

# URL parsing
url = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = "0.18"
console = "0.16"

# Configuration

# File operations
walkdir = { workspace = true }
ignore = { workspace = true }

# Client-side CPU accounting for the bench self-measurement block.
sysinfo = { workspace = true }
apif-source-row = { path = "crates/apif-source-row", version = "0.2.0" }
apif-cfg-runtime = { path = "crates/apif-cfg-runtime", version = "0.1.1" }
apif-diagnostics = { path = "crates/apif-diagnostics", version = "0.1.0" }
apif-parser = { path = "crates/apif-parser", version = "0.2.0" }
apif-assert = { path = "crates/apif-assert", version = "0.2.1" }
apif-state = { path = "crates/apif-state", version = "0.1.2" }
apif-plugins = { path = "crates/apif-plugins", version = "0.2.0" }
apif-execution = { path = "crates/apif-execution", version = "0.2.0" }
apif-utils = { path = "crates/apif-utils", version = "0.2.0" }
apif-report = { path = "crates/apif-report", version = "0.2.2" }
apif-semantics = { path = "crates/apif-semantics", version = "0.1.0" }
apif-optimizer = { path = "crates/apif-optimizer", version = "0.1.0" }
apif-query = { path = "crates/apif-query", version = "0.1.0" }
apif-grpc-transport = { path = "crates/apif-grpc-transport", version = "0.3.0", features = [
  "tonic-transport",
] }
apif-http-transport = { path = "crates/apif-http-transport", version = "0.2.2" }
rand = "0.10"
prost-reflect.workspace = true
futures = "0.3"
tower-lsp = "0.20"
rustyline = { version = "18", features = ["derive"] }
reqwest = { workspace = true }
axum = { workspace = true }
fake = { workspace = true }
tower-http = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }


[[test]]
name = "explain"
path = "tests/explain_tests.rs"
harness = true

[[test]]
name = "inspect"
path = "tests/inspect_tests.rs"
harness = true

[[test]]
name = "workflow"
path = "tests/workflow_tests.rs"
harness = true

[[test]]
name = "extract"
path = "tests/extract_tests.rs"
harness = true

[[test]]
name = "extract_metadata"
path = "tests/extract_metadata_tests.rs"
harness = true

[[test]]
name = "extract_ternary"
path = "tests/extract_ternary_tests.rs"
harness = true

[[test]]
name = "ternary_ast"
path = "tests/ternary_ast_tests.rs"
harness = true

[[test]]
name = "fmt"
path = "tests/fmt_tests.rs"
harness = true

[[test]]
name = "lsp_variable"
path = "tests/lsp_variable_tests.rs"
harness = true

[[test]]
name = "lsp_variable_definition"
path = "tests/lsp_variable_definition_tests.rs"
harness = true

[[test]]
name = "lsp_variable_definition_integration"
path = "tests/lsp_variable_definition_integration_tests.rs"
harness = true

[[test]]
name = "report"
path = "tests/report_tests.rs"
harness = true

[[bin]]
name = "test-server"
path = "tests/servers/bin.rs"
required-features = ["test-servers"]

[features]
default = []
ast-optimizer = []
proto-build = [
  "dep:tonic-prost",
  "dep:tonic-prost-build",
  "dep:protoc-bin-vendored",
]
test-servers = [
  "dep:tonic-prost",
  "dep:tonic-prost-build",
  "dep:protoc-bin-vendored",
  "dep:tonic-web",
]

[build-dependencies]
tonic-prost-build = { version = "0.14.5", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[dev-dependencies]
# Testing
tempfile = "3.27"
uuid = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }
tonic-health = "0.14.6"
tokio-stream = { workspace = true, features = ["net"] }
regex = { workspace = true }

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "assertion"
harness = false

[[bench]]
name = "runner_like"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "sources"
harness = false

[package.metadata.cargo-machete]
# Used only in feature-gated proto generation paths (`proto-build`, `test-servers`)
# and referenced by generated code.
ignored = [
  "tonic-prost",
  "tonic-prost-build",
  "protoc-bin-vendored",
  "tonic-web",
]
